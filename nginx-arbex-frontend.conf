server {
  server_name arbexfund.com www.arbexfund.com;
  root /var/www/arbex-frontend;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://m.stripe.network infird.com blob:; script-src-elem 'self' 'unsafe-inline' https://js.stripe.com https://m.stripe.network infird.com blob:; frame-src 'self' https://js.stripe.com https://m.stripe.network https:; connect-src 'self' api.arbexfund.com https://api.stripe.com https://js.stripe.com https://m.stripe.network https://r.stripe.com infird.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; worker-src 'self' blob:; child-src 'self' https://js.stripe.com https://m.stripe.network blob:;" always;
  add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(), camera=(), payment=(), usb=(), unoptimized-images=(), sync-xhr=()" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location / {
    try_files $uri /index.html;
  }

  # Proper caching and MIME types for static assets
  location ~* \.(woff2|woff|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Explicit MIME types for fonts
  types {
    font/woff2 woff2;
    font/woff woff;
    font/ttf ttf;
    font/otf otf;
    application/x-font-woff2 woff2;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/arbexfund.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/arbexfund.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = www.arbexfund.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  if ($host = arbexfund.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name arbexfund.com www.arbexfund.com;
  return 404; # managed by Certbot
}
